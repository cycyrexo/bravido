name: bravido
description: "BRAVIDO - Partout et tout le temps. Urgences, pharmacies de garde et établissements de santé."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dio: ^5.7.0
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2
  geolocator: ^13.0.2
  url_launcher: ^6.3.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  intl: ^0.20.1
  file_picker: ^8.1.4
  record: ^7.2.0
  audioplayers: ^6.8.1
  path_provider: ^2.1.6
  share_plus: ^12.0.2
  flutter_map_marker_cluster: ^1.4.0
  flutter_local_notifications: ^20.0.0
  timezone: ^0.10.0
  firebase_crashlytics: ^4.3.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/icone-bravido.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/icone-bravido-foreground.png"
