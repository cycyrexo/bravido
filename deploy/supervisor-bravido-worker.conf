; /etc/supervisor/conf.d/bravido-worker.conf
; Puis : sudo supervisorctl reread && sudo supervisorctl update && sudo supervisorctl status
; Les alertes SOS (file "alertes") sont traitees en priorite sur la file "default".
[program:bravido-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/bravido/backend/artisan queue:work --queue=alertes,default --tries=3 --sleep=1 --max-time=3600
directory=/var/www/bravido/backend
user=www-data
numprocs=2
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=3600
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/bravido-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
