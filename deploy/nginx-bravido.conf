# /etc/nginx/sites-available/bravido  (puis : ln -s ... /etc/nginx/sites-enabled/bravido)
# Remplacez api.exemple.ci par votre vrai nom de domaine (l'admin est servi sur le meme hote : /admin).
# Apres `certbot --nginx -d api.exemple.ci`, certbot ajoute lui-meme le bloc 443 et la redirection HTTPS.

# Zone de limitation de debit globale (en plus du throttle Laravel) : 20 requetes/s par IP
limit_req_zone $binary_remote_addr zone=bravido_req:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name api.exemple.ci;

    root /var/www/bravido/backend/public;
    index index.php;
    charset utf-8;

    # Televersements : photos d'etablissements, messages vocaux, programmes de garde (images/PDF)
    client_max_body_size 8m;

    # --- Compression ---
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    # --- En-tetes de securite ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), microphone=(self), camera=()" always;
    # A activer UNIQUEMENT une fois HTTPS en place et verifie :
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- Application Laravel ---
    location / {
        limit_req zone=bravido_req burst=40 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Fichiers statiques (css admin, photos via le lien symbolique public/storage cree par `php artisan storage:link`)
    location ~* \.(?:css|js|jpg|jpeg|png|gif|webp|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # --- PHP-FPM ---
    location ~ \.php$ {
        # Seul index.php est execute (evite l'execution de tout .php deposé par erreur)
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 90s;
        fastcgi_hide_header X-Powered-By;
    }

    # --- Fichiers caches (.env, .git, .htaccess...) : interdits. Exception : /.well-known pour certbot ---
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    # Le dossier racine du serveur est public/ : storage/, vendor/, .env ne sont donc pas atteignables.
    # Par precaution, on bloque aussi les extensions sensibles.
    location ~* \.(?:env|log|sql|bak|sqlite|ini|yml|yaml|lock|md)$ {
        deny all;
        return 404;
    }

    server_tokens off;
}
